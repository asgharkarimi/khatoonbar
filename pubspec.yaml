name: khatoonbar
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: 0.20.2
  persian_number_utility: ^1.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path: ^1.8.3
  pdf: ^3.10.7
  printing: ^5.11.1
  path_provider: ^2.1.1
  persian_datetime_picker: ^3.2.0
  image_picker: ^1.0.4
  flutter_local_notifications: ^17.1.2
  share_plus: ^10.1.4
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/khatoon_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/

  fonts:
    - family: IranYekan
      fonts:
        - asset: assets/fonts/iranyekan.ttf
